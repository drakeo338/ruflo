  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      const root = document.querySelector('[data-composition-id="03-four-pieces"]');
      const $ = (sel) => root.querySelector(sel);
      const $$ = (sel) => Array.from(root.querySelectorAll(sel));

      const CYAN = "#68e4ff";
      const MUTED = "#bdc9df";
      const CREAM = "#f7fbff";
      const DURATION = 12.181;

      // ---- deterministic gear outline (8 teeth) ----
      (function buildGear() {
        const cx = 60, cy = 60, R = 42, r = 32, teeth = 8;
        const pts = [];
        for (let i = 0; i < teeth; i++) {
          const a = (i * 360) / teeth;
          [[-15, r], [-8, R], [8, R], [15, r]].forEach(([da, rad]) => {
            const t = ((a + da - 90) * Math.PI) / 180;
            pts.push((cx + rad * Math.cos(t)).toFixed(2) + " " + (cy + rad * Math.sin(t)).toFixed(2));
          });
        }
        $("#fp03-gear").setAttribute("d", "M" + pts.join(" L") + " Z");
      })();

      // ---- svg-path-draw setup: measured length per stroke ----
      function prep(el, fallback) {
        let len = 0;
        try { len = el.getTotalLength(); } catch (e) { len = 0; }
        if (!len || !isFinite(len)) len = fallback;
        len = len * 1.02;
        el.style.strokeDasharray = len + " " + len;
        el.style.strokeDashoffset = String(len);
        return len;
      }

      const tl = gsap.timeline({ paused: true });

      // No camera move: the film's one camera move lives in frame 1; this shot holds a locked frame.

      // ---- Scene 1 (0.0–2.6s): headline per-word on spoken words + empty outlines draw left→right ----
      tl.fromTo("#fp03-stub", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, 0.1);
      // word starts from voice 03: Four 0.14 · pieces 0.42 · easy 1.27 · to 1.66 · confuse 1.85
      const wordAt = [["#fp03-w1", 0.14], ["#fp03-w2", 0.42], ["#fp03-w3", 1.27], ["#fp03-w4", 1.66], ["#fp03-w5", 1.85]];
      wordAt.forEach(([sel, t]) => {
        tl.fromTo(sel, { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, t);
      });

      // Outlines are NOT pre-drawn: each card's outline draws on with its content at that card's cue.
      const outlines = [1, 2, 3, 4].map((n) => $("#fp03-card" + n + " .fp03-outline path"));
      const outlineLens = outlines.map((p) => prep(p, 2 * (358.5 + 438.5)));
      tl.fromTo("#fp03-baseline", { scaleX: 0 }, { scaleX: 1, duration: 1.4, ease: "power3.out" }, 0.2);

      // Hide per-card content until its cue (fromTo gates, seek-safe)
      $$(".fp03-index, .fp03-icon, .fp03-name, .fp03-role, #fp03-r3b").forEach((el) => {
        tl.set(el, { opacity: 0 }, 0);
      });

      // ---- per-card fill on its spoken cue ----
      function fillCard(n, cue, roleCue) {
        const card = "#fp03-card" + n;
        const outline = outlines[n - 1];

        // cyan outline draws on with the card, starting 0.1s before icon/name
        const olen = outlineLens[n - 1];
        tl.fromTo(outline, { strokeDashoffset: olen, stroke: CYAN, strokeOpacity: 1 },
          { strokeDashoffset: 0, stroke: CYAN, strokeOpacity: 1, duration: 0.8, ease: "power3.out" }, cue - 0.1);

        tl.fromTo(card + " .fp03-index", { opacity: 0, y: 10 },
          { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, cue);

        // icon self-draws (svg-path-draw, staggered ~30% of segment dur)
        const icon = $("#fp03-icon" + n);
        tl.fromTo(icon, { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none" }, cue);
        const parts = Array.from(icon.querySelectorAll("path, circle"));
        const seg = 0.42;
        parts.forEach((p, i) => {
          const len = prep(p, 120);
          tl.fromTo(p, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: seg, ease: "power3.out" },
            cue + i * seg * 0.3);
        });

        tl.fromTo(card + " .fp03-name", { opacity: 0, y: 28 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, cue + 0.15);

        tl.fromTo(card + " .fp03-role", { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, roleCue);
      }

      // previous card settles to ink at the instant the next goes active
      function settleCard(n, at) {
        const outline = outlines[n - 1];
        const icon = $("#fp03-icon" + n);
        tl.fromTo(outline, { stroke: CYAN, strokeOpacity: 1 },
          { stroke: MUTED, strokeOpacity: 0.85, duration: 0.35, ease: "power3.out", immediateRender: false }, at);
        tl.fromTo(icon.querySelectorAll("path, circle"), { stroke: CYAN },
          { stroke: CREAM, duration: 0.35, ease: "power3.out", immediateRender: false }, at);
        tl.fromTo("#fp03-card" + n + " .fp03-index", { color: CYAN },
          { color: MUTED, duration: 0.35, ease: "power3.out", immediateRender: false }, at);
      }

      // Scene 2 (2.6–4.5s): model@2.8, reasoning@3.7
      fillCard(1, 2.8, 3.7);
      // Scene 3 (4.5–6.3s): skill@4.7, playbook@5.4
      settleCard(1, 4.7);
      fillCard(2, 4.7, 5.4);
      // Scene 4 (6.3–10.2s): MCP@6.4, "discover and call"@7.9, tools@9.2
      settleCard(2, 6.4);
      fillCard(3, 6.4, 7.9);
      tl.fromTo("#fp03-r3b", { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 9.2);
      // Scene 5 (10.2–12.18s): runtime@10.7, performs@11.3 — cyan stays on card 4, set holds still
      settleCard(3, 10.7);
      fillCard(4, 10.7, 11.3);

      // pad the timeline to the fixed frame duration (no tween — the set simply holds)
      tl.set({}, {}, DURATION);

      window.__timelines = window.__timelines || {};
      window.__timelines["03-four-pieces"] = tl;
    })();
  </script>
