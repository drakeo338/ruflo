  <div id="root" data-composition-id="05-capabilities" data-width="1920" data-height="1080" data-duration="11.139">
    <div class="clip c05-bg" id="c05-bg" data-start="0" data-duration="11.139" data-track-index="0"></div>

    <div class="c05-stage" id="c05-stage">
      <!-- background: faint concentric hairline rings -->
      <svg class="c05-rings" id="c05-rings" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">

        <ellipse id="c05-ring-2" cx="960" cy="454" rx="275" ry="187" />

      <!-- supporting: connectors hub -> node (coords set in script from one center) -->
      <svg class="c05-lines" id="c05-lines" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">

      <!-- node placeholders, nodes, labels (positions set in script) -->
      <div class="c05-dot" id="c05-dot-0"></div>

      <div class="c05-dot" id="c05-dot-3"></div>

      <div class="c05-node" id="c05-node-1">02</div>

      <div class="c05-node" id="c05-node-3">04</div>

      <!-- foreground subject: the hub -->
      <svg class="c05-hub-svg" id="c05-hub-svg" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
        <path class="c05-hex" id="c05-hex" d="M 960 334 L 1063.92 394 L 1063.92 514 L 960 574 L 856.08 514 L 856.08 394 Z" />
      </svg>
      <div class="c05-hub-label" id="c05-hub-label">RuFlo</div>

  </div>

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var CYAN = "#68E4FF";
      var CREAM = "#F7FBFF";
      var MUTED = "#BDC9DF";

      // One shared center — the hub's rendered center.
      var C = { x: 960, y: 454 };
      var RX = 440;
      var RY = 300;
      var HUB_GAP = 132; // line starts just outside the hexagon edge
      var NODE_GAP = 46; // line ends just outside the node ring
      var N = 6;
      // spoken order, clockwise from 12 o'clock
      var CUES = [1.2, 4.0, 4.7, 7.3, 8.1, 9.5];
      var RESOLVE = 10.0;

      var q = function (id) { return document.getElementById(id); };

      var pts = [];
      for (var i = 0; i < N; i++) {
        var a = (i / N) * Math.PI * 2 - Math.PI / 2;
        var x = C.x + Math.cos(a) * RX;
        var y = C.y + Math.sin(a) * RY;
        pts.push({ x: x, y: y });

        var dot = q("c05-dot-" + i);
        dot.style.left = x + "px";
        dot.style.top = y + "px";
        var node = q("c05-node-" + i);
        node.style.left = x + "px";
        node.style.top = y + "px";
        var label = q("c05-label-" + i);
        label.style.left = x + "px";
        label.style.top = y + "px";

        var dx = x - C.x;
        var dy = y - C.y;
        var d = Math.hypot(dx, dy);
        var ux = dx / d;
        var uy = dy / d;
        var line = q("c05-line-" + i);
        line.setAttribute("x1", String(C.x + ux * HUB_GAP));
        line.setAttribute("y1", String(C.y + uy * HUB_GAP));
        line.setAttribute("x2", String(x - ux * NODE_GAP));
        line.setAttribute("y2", String(y - uy * NODE_GAP));
        var len = d - HUB_GAP - NODE_GAP;
        line.style.strokeDasharray = String(len);
        line.style.strokeDashoffset = String(len);
      }

      var hex = q("c05-hex");
      var hexLen = hex.getTotalLength() * 1.02;
      hex.style.strokeDasharray = String(hexLen);
      hex.style.strokeDashoffset = String(hexLen);

      var tl = gsap.timeline({ paused: true });

      // ── Scene 1 (0.0–1.2s): hub self-draws, rings resolve, dim node positions ──
      tl.fromTo(hex, { strokeDashoffset: hexLen }, { strokeDashoffset: 0, duration: 0.8, ease: "power2.out" }, 0.1);
      tl.fromTo("#c05-hub-label", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45, ease: "power1.out" }, 0.3);
      tl.fromTo(
        ["#c05-ring-1", "#c05-ring-2", "#c05-ring-3"],
        { opacity: 0 },
        { opacity: 0.25, duration: 0.7, ease: "power1.out", stagger: 0.12 },
        0.2
      );
      for (var k = 0; k < N; k++) {
        tl.fromTo("#c05-dot-" + k, { opacity: 0, scale: 0 }, { opacity: 0.55, scale: 1, duration: 0.35, ease: "power2.out" }, 0.55 + k * 0.07);
      }

      // ── Scene 2 (1.2–10.0s): each capability lights on its spoken word ──
      for (var j = 0; j < N; j++) {
        var t = CUES[j];
        var line = "#c05-line-" + j;
        var node = "#c05-node-" + j;
        var label = "#c05-label-" + j;
        var isLeft = j >= 4;
        var lineLen = parseFloat(q("c05-line-" + j).style.strokeDasharray);

        // connector draws FROM hub TO node
        tl.fromTo(line, { strokeDashoffset: lineLen }, { strokeDashoffset: 0, duration: 0.4, ease: "power2.inOut" }, t);
        // node lands cyan as the line arrives
        tl.fromTo(node, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" }, t + 0.1);
        tl.fromTo("#c05-dot-" + j, { opacity: 0.55 }, { opacity: 0, duration: 0.2, ease: "power1.out", immediateRender: false }, t + 0.1);
        // label sets beside it
        tl.fromTo(
          label,
          { opacity: 0, x: isLeft ? 24 : -24 },
          { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" },
          t + 0.15
        );

        // settle to ink (cream foreground) when the next one lights (only the newest stays cyan)
        var settleAt = j < N - 1 ? CUES[j + 1] + 0.1 : RESOLVE;
        tl.to(node, { borderColor: CREAM, color: CREAM, duration: 0.35, ease: "power1.out" }, settleAt);
        tl.to(line, { stroke: MUTED, opacity: 0.45, duration: 0.35, ease: "power1.out" }, settleAt);
      }

      // ── Scene 3 (10.0–10.54s): resolve on the core — hub turns cyan, hold ──
      tl.to(hex, { stroke: CYAN, duration: 0.3, ease: "power1.out" }, RESOLVE);
      tl.to("#c05-hub-label", { color: CYAN, duration: 0.3, ease: "power1.out" }, RESOLVE);

      // pin exact length
      tl.set({}, {}, 10.539);

      window.__timelines["05-capabilities"] = tl;
    })();
  </script>
