  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      const DUR = 7.616;
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const heroText = document.getElementById("e08-hero-text");
      const heroInner = document.getElementById("e08-hero-inner");
      const strike = document.getElementById("e08-strike");
      const kicker = document.getElementById("e08-kicker");
      const caption = document.getElementById("e08-caption");

      // ---- discrete-text-sequence: in-place hard-cut state swap ----
      const T_SWAP = 2.6;
      const SEQUENCE = [
        { t: 0.0, text: "“done”", color: "#F7FBFF", kicker: "THE CLAIM", caption: "NOT A TEST RESULT", strike: 1 },
        { t: T_SWAP, text: "evidence", color: "#FFCB6B", kicker: "THE PROOF", caption: "THE CHANGE PLUS EVIDENCE", strike: 0 }, // the frame's one gold
      ];
      function stateAt(time) {
        for (let i = SEQUENCE.length - 1; i >= 0; i--) {
          if (time >= SEQUENCE[i].t) return SEQUENCE[i];
        }
        return SEQUENCE[0];
      }

      // Hold jitter on "evidence" only — deterministic sin-sum, driven by timeline time.
      const T_JITTER = 3.8; // Scene 3 hold
      function jitterAt(time) {
        if (time < T_JITTER) return [0, 0];
        const k = Math.min(1, (time - T_JITTER) / 0.4);
        const dx = (Math.sin(time * 37.0) * 0.9 + Math.sin(time * 91.0) * 0.6) * k;
        const dy = (Math.sin(time * 53.0) * 0.6 + Math.sin(time * 23.0) * 0.4) * k;
        return [dx, dy];
      }

      // Swap punctuation: 1.06 -> 1 settle (power3.out) right after the hard cut, computed from
      // timeline time so it is identical under any seek order (no from-state left behind).
      const SETTLE = 0.35;
      function settleAt(time) {
        if (time < T_SWAP || time >= T_SWAP + SETTLE) return 1;
        const p = (time - T_SWAP) / SETTLE;
        return 1 + 0.06 * Math.pow(1 - p, 3);
      }

      const driver = { t: 0 };
      function render() {
        const s = stateAt(driver.t);
        if (heroText.textContent !== s.text) heroText.textContent = s.text;
        heroText.style.color = s.color;
        kicker.textContent = s.kicker;
        if (caption.textContent !== s.caption) caption.textContent = s.caption; // hard cut with the word swap
        strike.style.visibility = s.strike ? "visible" : "hidden";
        const j = jitterAt(driver.t);
        heroInner.style.translate = j[0].toFixed(2) + "px " + j[1].toFixed(2) + "px";
        heroInner.style.scale = settleAt(driver.t).toFixed(4);
      }
      render();
      tl.to(driver, { t: DUR, duration: DUR, ease: "none", onUpdate: render }, 0);

      // ---- Scene 1 (0.0–1.9): quoted "done" sets; ch13 inset settles ----
      tl.fromTo("#e08-kicker-row", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.1);
      tl.fromTo(
        "#e08-hero-text",
        { opacity: 0, y: 40 },
        { opacity: 1, y: 0, duration: 0.55, ease: "expo.out" },
        0.1,
      );
      tl.fromTo("#e08-doc", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.3);

      // ---- Scene 2 (1.9–3.8): cyan strike draws L→R, then hard cut to "evidence" ----
      tl.fromTo("#e08-strike", { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "expo.out" }, 1.9);
      tl.fromTo("#e08-caption", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 2.0);

      // ---- Scene 3 (3.8–7.62): checklist, one row per spoken item ----
      tl.fromTo("#e08-list", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power3.out" }, 3.8);
      tl.fromTo("#e08-list-head", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, 3.8);
      const ROWS = [
        { row: "#e08-row-1", check: "#e08-check-1", t: 4.1 },
        { row: "#e08-row-2", check: "#e08-check-2", t: 5.0 },
        { row: "#e08-row-3", check: "#e08-check-3", t: 7.1 },
      ];
      ROWS.forEach(function (r) {
        tl.fromTo(r.row, { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, r.t);
        tl.fromTo(r.check, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.3, ease: "power3.out" }, r.t + 0.08);
      });

      window.__timelines["08-evidence"] = tl;
    })();
  </script>
