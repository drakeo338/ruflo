      const weights = [];

      const SEQUENCE = [{ t: 0, text: "", color: CREAM }];
      let acc = T0;
      for (let i = 0; i < CMD.length; i++) {
        const seg = (i >= brandStart && i < brandEnd) ? ACCENT : CREAM;

      const TYPING_GRACE = 0.12;

      function entryAt(time) {

          cursorEl.style.background = e.color;
          const p = (drv.t / DUR) * Math.PI * 2 * BLINK_CYCLES;
          const typing = CHANGE_TIMES.some((c) => c <= drv.t && drv.t - c < TYPING_GRACE);
          // finite blink: caret only lives while the pill is on screen (Scene 3 carries it away)
          cursorEl.style.opacity = (typing || Math.sin(p) > 0) ? "1" : "0";
